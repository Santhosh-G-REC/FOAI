<div class="min-h-screen flex flex-col bg-[#09090b] text-zinc-100 font-sans selection:bg-indigo-500 selection:text-white">
  <!-- Top Navigation Header -->
  <app-top-nav-bar
    (setRole)="onRoleChanged($event)"
    (openSupabaseModal)="isSupabaseModalOpen.set(true)">
  </app-top-nav-bar>

  <!-- Main Application Body -->
  <div class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5 lg:p-6 flex gap-5">
    <!-- Left Navigation Sidebar -->
    <app-side-nav-bar
      [activeTab]="activeTab()"
      (selectTab)="onTabSelected($event)">
    </app-side-nav-bar>

    <!-- Main Content Stage -->
    <main class="flex-1 min-w-0" role="main" aria-label="Active Tab Content">
      <!-- Live Solver Telemetry Bar -->
      <app-solver-status-bar></app-solver-status-bar>

      <!-- TAB 1: OVERVIEW & DASHBOARD -->
      <ng-container *ngIf="activeTab() === 'overview'">
        <app-overview-hero
          (exportRoomReport)="onExportRoomReport()">
        </app-overview-hero>

        <app-stat-cards></app-stat-cards>

        <app-timetable-grid
          (selectItem)="onSelectCourse($event)">
        </app-timetable-grid>

        <app-smart-allocator></app-smart-allocator>
      </ng-container>

      <!-- TAB 2: WEEKLY CLASS MATRIX -->
      <ng-container *ngIf="activeTab() === 'timetable'">
        <app-timetable-grid
          (selectItem)="onSelectCourse($event)">
        </app-timetable-grid>
      </ng-container>

      <!-- TAB 3: MULTI-STAGE SEMESTER EXAMS -->
      <ng-container *ngIf="activeTab() === 'exams'">
        <app-exam-stages></app-exam-stages>
      </ng-container>

      <!-- TAB 4: ROOMS & FACILITY INSPECTOR -->
      <ng-container *ngIf="activeTab() === 'rooms'">
        <app-rooms-view></app-rooms-view>
      </ng-container>

      <!-- TAB 5: FACULTY DIRECTORY -->
      <ng-container *ngIf="activeTab() === 'faculty'">
        <app-faculty-view></app-faculty-view>
      </ng-container>

      <!-- TAB 6: PERSONALIZED STUDENT SCHEDULE -->
      <ng-container *ngIf="activeTab() === 'student'">
        <app-student-view></app-student-view>
      </ng-container>

      <!-- TAB 7: SMART ALLOCATOR & SEARCH TELEMETRY -->
      <ng-container *ngIf="activeTab() === 'allocator'">
        <app-smart-allocator></app-smart-allocator>
      </ng-container>

      <!-- TAB 8: CONFLICT AUDITOR -->
      <ng-container *ngIf="activeTab() === 'conflicts'">
        <app-conflict-resolver-modal></app-conflict-resolver-modal>
      </ng-container>
    </main>
  </div>

  <!-- Product Footer -->
  <footer class="border-t border-zinc-900 bg-[#070709] px-6 py-3 text-center text-xs font-mono text-zinc-400">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
        <span>AeroChronos Pro • Production Grade Academic Infrastructure</span>
      </div>
      <div class="flex items-center gap-4 text-zinc-400">
        <span>Units I, II & III AI Engine</span>
        <span>•</span>
        <span>Zero Backtracks</span>
        <span>•</span>
        <span>Keyboard: [1–8] Switch Views, [Esc] Close</span>
      </div>
    </div>
  </footer>

  <!-- Dialog Modals -->
  <app-supabase-modal
    *ngIf="isSupabaseModalOpen()"
    (close)="isSupabaseModalOpen.set(false)">
  </app-supabase-modal>

  <app-course-detail-modal
    [item]="selectedCourseDetail()"
    (close)="selectedCourseDetail.set(null)">
  </app-course-detail-modal>
</div>
